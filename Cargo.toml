[package]
name = "rust-dhbv2"
version = "0.1.0"
edition = "2024"

description = "A Rust BMI (Basic Model Interface) adapter for δHBV 2.0 (daily) and δHBV 2.1 MTS (hourly) inference with the published PyTorch weights."
readme = "./README.md"
authors = ["Josh Cunningham <jcunningham8@ua.edu>"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bmi-rs = { git = "https://github.com/joshcu/bmi-rs/", package = "bmi-rs", branch = "compat", features = ["compat"] }
burn = { version = "0.22.1", features = ["flex", "pytorch"] }
ffi = { git = "https://github.com/joshcu/bmi-rs/", package = "bmi-rs-sys", branch = "compat" }
serde = { version = "1.0.226", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9.34"

[profile.release]
debug = false
